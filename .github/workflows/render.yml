name: render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install node dependencies
        run: npm ci

      - name: Install ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
            exit 0
          fi
          sudo apt-get update \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg || true
          if ! command -v ffmpeg >/dev/null 2>&1; then
            curl -fsSL --max-time 180 -o /tmp/ff.tar.xz \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf /tmp/ff.tar.xz -C /tmp
            sudo cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /usr/local/bin/
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install Kokoro TTS
        run: pip install --quiet kokoro-onnx numpy

      - name: Fetch Kokoro model and voices
        run: |
          curl -fsSL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fsSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -lh kokoro-v1.0.onnx voices-v1.0.bin

      - name: Narrate and build manifest from the audio
        run: python3 scripts/tts_kokoro.py --model kokoro-v1.0.onnx --voices voices-v1.0.bin

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Render
        run: npx remotion render src/index.ts Video out/video.mp4 --gl=swangle --concurrency=3 --log=info

      - name: Stitch narration track
        run: |
          ffmpeg -y -f concat -safe 0 -i public/audio/list.txt -c copy out/narration.wav || true
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out/video.mp4

      - name: Level the mix
        run: python3 scripts/level.py

      - name: QA probe and frames
        run: python3 scripts/qa.py

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/video.mp4
            out/narration.wav
            out/qa/
          retention-days: 14
          if-no-files-found: error
